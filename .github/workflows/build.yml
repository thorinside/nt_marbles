name: Build nt_marbles

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev zip

      - name: Test, build, inspect, and verify overlay
        run: |
          make test verify-overlay

      - name: Package plugin
        run: |
          make ARM_CXX=arm-none-eabi-g++ package

      - uses: actions/upload-artifact@v4
        with:
          name: nt_marbles-plugin
          path: |
            nt_marbles-plugin.zip
            nt_marbles-plugin.zip.sha256
          if-no-files-found: error
