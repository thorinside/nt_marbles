name: Build nt_marbles

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev zip

      - name: Build, inspect, and verify overlay
        run: |
          make ARM_CXX=arm-none-eabi-g++ inspect verify-overlay

      - name: Package plugin
        run: |
          mkdir -p release/programs/plug-ins
          cp plugins/nt_marbles.o release/programs/plug-ins/
          (cd release && zip -r ../nt_marbles-plugin.zip programs)

      - uses: actions/upload-artifact@v4
        with:
          name: nt_marbles-plugin
          path: nt_marbles-plugin.zip
          if-no-files-found: error
